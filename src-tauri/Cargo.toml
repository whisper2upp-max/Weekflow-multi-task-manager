[package]
name = "weekflow-tauri"
version = "3.0.0"
description = "Weekflow - Tauri v2 任务管理应用"
authors = ["Wesley Yan"]
license = "UNLICENSED"
edition = "2021"

[lib]
name = "weekflow_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
directories = "6"

[profile.release]
strip = true
lto = true
opt-level = "z"
